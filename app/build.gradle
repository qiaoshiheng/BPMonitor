plugins {
    id 'com.android.application'
}

android {
    namespace 'com.q.bpmonitor'
    compileSdk 36

    defaultConfig {
        applicationId 'com.q.bpmonitor'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig false
    }
}

dependencies {
}
